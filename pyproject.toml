[project]
name = "acs-crm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cookiecutter>=2.7.1",
    "django==5.2",
    "django-environ>=0.14.0",
    "django-extensions>=4.1",
    "django-filter>=26.1",
    "django-simple-history>=3.12.0",
    "django-tailwind>=4.5.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.2",
    "xlwt>=1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

# Directories Ruff should ignore
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "node_modules",
    "staticfiles",
    "media",
    "migrations"
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "DJ",     # Django-specific rules
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "RUF"     # Ruff-specific rules
]

ignore = [
    "E501"
]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "apps"
]

section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
