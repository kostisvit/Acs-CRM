{% if request.session.customer_view != 'table' %}

    <!-- CARDS VIEW -->
    <div
        id="customer-list"
        class="grid w-full grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4"
    >
        {% include "cash/customers/_customer_items.html" %}
    </div>

    <div id="load-more-container" class="mt-8 flex justify-center">
        {% include "cash/customers/_load_more.html" %}
    </div>

{% else %}

    <!-- TABLE VIEW -->
    <div id="customer-table">
        {% include "cash/customers/_customer_table.html" %}
    </div>

{% endif %}
