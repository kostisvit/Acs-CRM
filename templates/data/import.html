{% extends '_base.html' %}

{% block content %}

<div class="max-w-xl mx-auto mt-10">
    <div class="bg-white shadow-md rounded-lg p-6">

        <h1 class="text-2xl font-semibold text-gray-800 mb-6">
            Import Data
        </h1>

        <!-- Django Messages -->
        {% if messages %}
            <div class="space-y-3 mb-6">
                {% for message in messages %}
                    <div 
                        class="px-4 py-3 rounded-md text-sm
                        {% if message.tags == 'success' %}
                            bg-green-100 text-green-800 border border-green-200
                        {% elif message.tags == 'error' %}
                            bg-red-100 text-red-800 border border-red-200
                        {% elif message.tags == 'warning' %}
                            bg-yellow-100 text-yellow-800 border border-yellow-200
                        {% else %}
                            bg-blue-100 text-blue-800 border border-blue-200
                        {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}


        <!-- Import Form -->
        <form method="post" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Upload CSV / Excel File
                </label>
                <div class="mb-4">
                    <label 
                        for="importer"
                        class="mb-2 block text-sm font-medium text-gray-700"
                    >
                        Επιλογή τύπου εισαγωγής:
                    </label>

                    <select 
                        id="importer"
                        name="importer"
                        class="block w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm text-gray-700 shadow-sm transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                    >
    {% for key, importer in importers.items %}
        <option value="{{ key }}">
            {{ importer.label }}
        </option>
    {% endfor %}
                    </select>
                </div>
                <input 
                    type="file" 
                    name="file" 
                    accept=".csv,.xlsx"
                    class="block w-full text-sm text-gray-600
                           border border-gray-300 rounded-lg
                           cursor-pointer
                           focus:outline-none
                           focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500
                           p-2
                           shadow-sm"
                >
            </div>


            <button 
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700
                       text-white font-medium
                       py-2.5 px-4 rounded-lg
                       transition duration-200">
                Import
            </button>

        </form>

    </div>
</div>

{% endblock %}
