{% extends '_base.html' %}

{% block title %}Εργασίες{% endblock %}

{% block content %}
 <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">

    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">

        <div>
            <h2 class="text-lg font-semibold text-gray-900">
                Εργασίες
            </h2>

            <p class="text-sm text-gray-500">
                Λίστα Εργασιών Οργανισμού
            </p>
        </div>

        <div class="flex flex-wrap items-center justify-end gap-3">

            <!-- Search -->
            <form
                hx-get="{% url 'organizations:task_list' %}"
                hx-target="#task-wrapper"
                hx-swap="innerHTML"
                hx-push-url="true"
                hx-trigger="keyup changed delay:500ms"
            >

                <input
                    type="text"
                    name="q"
                    value="{{ search }}"
                    placeholder="Αναζήτηση..."
                    class="w-64 rounded-lg border border-gray-300 px-4 py-2
                           focus:border-teal-400 focus:outline-none
                           focus:ring-2 focus:ring-teal-300"
                >

            </form>

            <!-- Export -->
            <a
                id="export-ergasies"
                data-export-url="{% url 'organizations:export_ergasies' %}"
                href="{% url 'organizations:export_ergasies' %}"
                class="inline-flex items-center justify-center rounded-lg
                       border border-green-500 bg-white px-4 py-2
                       text-sm font-medium text-gray-700 hover:bg-green-300"
            >
                Export
            </a>

            <!-- Import -->
            <a
                href="{% url 'organizations:task_excel_import' %}"
                class="inline-flex items-center justify-center rounded-lg
                       border border-teal-300 bg-white px-4 py-2
                       text-sm font-medium text-gray-700 hover:bg-teal-50"
            >
                Import
            </a>

            <!-- Create -->
            <a
                href="{% url 'organizations:task_create' %}"
                class="rounded-lg bg-teal-300 px-5 py-2
                       text-sm font-semibold text-gray-900 hover:bg-teal-400"
            >
                + Νέα εγγραφή
            </a>

        </div>

    </div>

</div>


<div class="mt-6"></div>


<div
    x-data="{ openFilter: false }"
    @htmx:after-request.window="openFilter = false"
>

    <!-- Header -->
    <div class="mb-6 flex items-center justify-between">

        <button
            type="button"
            @click="openFilter = true"
            class="rounded-xl bg-teal-600 px-6 py-3
                   text-sm font-semibold text-white hover:bg-teal-700"
        >
            Φίλτρα
        </button>


        <!-- View mode -->
        <form method="post">
            {% csrf_token %}

            <button
                name="view_mode"
                value="{% if request.session.task_view == 'cards' or not request.session.task_view %}table{% else %}cards{% endif %}"
                class="rounded-md border bg-white px-3 py-2 text-slate-700"
            >

                {% if request.session.task_view == 'cards' or not request.session.task_view %}

                    <svg
                        class="h-5 w-5"
                        fill="currentColor"
                        viewBox="0 0 20 20"
                    >
                        <path d="M3 3h6v6H3V3zm8 0h6v6h-6V3zM3 11h6v6H3v-6zm8 0h6v6h-6v-6z"/>
                    </svg>

                {% else %}

                    <svg
                        class="h-5 w-5"
                        fill="currentColor"
                        viewBox="0 0 20 20"
                    >
                        <path d="M3 4h14v2H3V4zm0 5h14v2H3V9zm0 5h14v2H3v-2z"/>
                    </svg>

                {% endif %}

            </button>

        </form>

    </div>


    <!-- FILTER MODAL -->
    <div
        x-show="openFilter"
        x-transition
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
        style="display:none"
    >

        <div
            @click.outside="openFilter=false"
            class="max-h-[90vh] w-full max-w-6xl overflow-y-auto
                   rounded-xl bg-white p-6 shadow-xl"
        >

            <div class="mb-6 flex items-center justify-between">

                <h2 class="text-xl font-semibold">
                    Φίλτρα αναζήτησης
                </h2>

                <button
                    type="button"
                    @click="openFilter=false"
                    class="text-gray-500 hover:text-gray-900"
                >
                    ✕
                </button>

            </div>


            <form
                method="get"
                hx-get="{% url 'organizations:task_list' %}"
                hx-target="#task-wrapper"
                hx-swap="innerHTML"
                hx-push-url="true"
                id="task-filter-form"
            >
                <div class="mb-6">
                    <input
                        type="text"
                        name="q"
                        value="{{ request.GET.q|default:'' }}"
                        placeholder="Αναζήτηση εργασίας..."
                        class="w-full rounded-xl border border-gray-300
                            px-5 py-4 text-lg shadow-sm
                            focus:border-teal-500 focus:outline-none
                            focus:ring-2 focus:ring-teal-500/20"
                    >
                </div>

                <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">

                    <select
                        name="organization"
                        class="rounded-lg border px-4 py-3"
                    >
                        <option value="">
                            Όλοι οι οργανισμοί
                        </option>

                        {% for org in filter.form.organization.field.queryset %}
                            <option
                                value="{{ org.pk }}"
                                {% if request.GET.organization == org.pk|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >
                                {{ org }}
                            </option>
                        {% endfor %}
                    </select>

                    <select
                        name="org_app"
                        class="rounded-lg border px-4 py-3"
                    >
                        <option value="">
                            Όλες οι εφαρμογές OTS
                        </option>

                        {% for app in filter.form.org_app.field.queryset %}
                            <option
                                value="{{ app.pk }}"
                                {% if request.GET.org_app == app.pk|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >
                                {{ app }}
                            </option>
                        {% endfor %}
                    </select>

                    <select
                        name="job_type_acs"
                        class="rounded-lg border px-4 py-3"
                    >
                        <option value="">
                            Όλοι οι τύποι εργασίας
                        </option>

                        {% for job in filter.form.job_type_acs.field.queryset %}
                            <option
                                value="{{ job.pk }}"
                                {% if request.GET.job_type_acs == job.pk|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >
                                {{ job }}
                            </option>
                        {% endfor %}
                    </select>

                    <select
                        name="acs_employee"
                        class="rounded-lg border px-4 py-3"
                    >
                        <option value="">
                            Όλοι οι υπάλληλοι ACS
                        </option>

                        {% for emp in filter.form.acs_employee.field.queryset %}
                            <option
                                value="{{ emp.pk }}"
                                {% if request.GET.acs_employee == emp.pk|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >
                                {{ emp }}
                            </option>
                        {% endfor %}
                    </select>

                    <select
                        name="org_employee"
                        class="rounded-lg border px-4 py-3"
                    >
                        <option value="">
                            Όλοι οι υπάλληλοι οργανισμού
                        </option>

                        {% for emp in filter.form.org_employee.field.queryset %}
                            <option
                                value="{{ emp.pk }}"
                                {% if request.GET.org_employee == emp.pk|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >
                                {{ emp }}
                            </option>
                        {% endfor %}
                    </select>

                    <input
                        type="text"
                        name="ticketid"
                        value="{{ request.GET.ticketid|default:'' }}"
                        placeholder="Αίτημα OTS"
                        class="rounded-lg border px-4 py-3"
                    >

                    <input
                        type="date"
                        name="importdate_after"
                        value="{{ request.GET.importdate_after|default:'' }}"
                        class="rounded-lg border px-4 py-3"
                    >

                    <input
                        type="date"
                        name="importdate_before"
                        value="{{ request.GET.importdate_before|default:'' }}"
                        class="rounded-lg border px-4 py-3"
                    >

                    <input
                        type="number"
                        name="year"
                        value="{{ request.GET.year|default:'' }}"
                        placeholder="Έτος"
                        min="2000"
                        max="2100"
                        class="rounded-lg border px-4 py-3"
                    >

                    <button
                        type="submit"
                        class="rounded-lg bg-teal-600 px-4 py-3
                            text-white hover:bg-teal-700"
                    >
                        Αναζήτηση
                    </button>
                </div>
            </form>


        </div>

    </div>

</div>


<!-- ========================================================= -->
<!-- RESULTS -->
<!-- ========================================================= -->

<div id="task-wrapper">

    {% include "organizations/task/_task_results.html" %}

</div>

<script> document.addEventListener("DOMContentLoaded", function () { const exportLink = document.getElementById("export-ergasies"); if (!exportLink) { return; } function updateExportUrl() { const currentUrl = new URL(window.location.href); const exportUrl = new URL(exportLink.dataset.exportUrl, window.location.origin); exportUrl.search = currentUrl.search; exportLink.href = exportUrl.toString(); } exportLink.dataset.exportUrl = exportLink.href; updateExportUrl(); document.body.addEventListener("htmx:pushedIntoHistory", function () { updateExportUrl(); }); window.addEventListener("popstate", function () { updateExportUrl(); }); }); </script>



<script>
    setTimeout(() => {
        const messages = document.getElementById("messages");

        if (messages) {
            messages.style.transition = "opacity 0.5s ease";
            messages.style.opacity = "0";

            setTimeout(() => {
                messages.remove();
            }, 500);
        }
    }, 3000);
</script>
{% endblock %}
