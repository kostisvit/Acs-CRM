{% extends '_base.html' %}

{% block title %}Εργασίες{% endblock %}

{% block content %}
 <div class="rounded-2xl border border-slate-200 bg-white shadow-sm">

    <div class="flex flex-col gap-5 p-5 lg:flex-row lg:items-center lg:justify-between">

        <!-- Header -->
        <div class="min-w-0">
            <div class="flex items-center gap-3">

                <!-- Tasks Icon -->
                <div
                    class="flex h-10 w-10 shrink-0 items-center justify-center
                           rounded-xl bg-teal-50 text-teal-600"
                >
                    <svg
                        class="h-5 w-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="1.8"
                            d="M9 5h6
                               M9 3h6a1 1 0 011 1v2a1 1 0 01-1 1H9a1 1 0 01-1-1V4a1 1 0 011-1z
                               M6 7h12a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V9a2 2 0 012-2z
                               M8 12l1.5 1.5L12 11
                               M8 17l1.5 1.5L12 16"
                        />
                    </svg>
                </div>

                <div>
                    <h2 class="text-lg font-semibold tracking-tight text-slate-900">
                        Εργασίες
                    </h2>

                    <p class="mt-0.5 text-sm text-slate-500">
                        Λίστα Εργασιών Οργανισμού
                    </p>
                </div>

            </div>
        </div>


        <!-- Actions -->
        <div class="flex flex-col gap-2.5 sm:flex-row sm:items-center">

            <!-- Search -->
            <form
                hx-get="{% url 'organizations:task_list' %}"
                hx-target="#task-wrapper"
                hx-swap="innerHTML"
                hx-push-url="true"
                hx-trigger="keyup changed delay:500ms"
                class="relative"
            >
                <svg
                    class="pointer-events-none absolute left-3.5 top-1/2
                           h-4 w-4 -translate-y-1/2 text-slate-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="m21 21-4.35-4.35
                           M19 11a8 8 0 11-16 0 8 8 0 0116 0z"
                    />
                </svg>

                <input
                    type="text"
                    name="q"
                    value="{{ search }}"
                    placeholder="Αναζήτηση εργασιών..."
                    autocomplete="off"
                    class="h-10 w-full rounded-xl border border-slate-200
                           bg-slate-50 pl-10 pr-4 text-sm text-slate-700
                           placeholder:text-slate-400
                           transition-all duration-200
                           hover:border-slate-300
                           focus:border-teal-500
                           focus:bg-white
                           focus:outline-none
                           focus:ring-2 focus:ring-teal-500/10
                           sm:w-64"
                />
            </form>


            <!-- Divider -->
            <div class="hidden h-7 w-px bg-slate-200 sm:block"></div>


            <!-- Export -->
            <a
                id="export-ergasies"
                data-export-url="{% url 'organizations:export_ergasies' %}"
                href="{% url 'organizations:export_ergasies' %}"
                class="group inline-flex h-10 items-center justify-center
                       gap-2 rounded-xl border border-slate-200
                       bg-white px-4
                       text-sm font-semibold text-slate-600
                       shadow-sm transition-all duration-200
                       hover:border-slate-300
                       hover:bg-slate-50
                       hover:text-slate-900
                       hover:shadow-md
                       focus:outline-none
                       focus:ring-2 focus:ring-slate-300/40
                       active:scale-[0.98]"
            >
                <svg
                    class="h-4 w-4 text-slate-400
                           transition-colors group-hover:text-slate-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M12 3v12m0 0l-4-4m4 4l4-4
                           M5 21h14"
                    />
                </svg>

                <span>Export</span>
            </a>


            <!-- Import -->
            <a
                href="{% url 'organizations:task_excel_import' %}"
                class="group inline-flex h-10 items-center justify-center
                       gap-2 rounded-xl border border-slate-200
                       bg-white px-4
                       text-sm font-semibold text-slate-600
                       shadow-sm transition-all duration-200
                       hover:border-teal-200
                       hover:bg-teal-50
                       hover:text-teal-700
                       hover:shadow-md
                       focus:outline-none
                       focus:ring-2 focus:ring-teal-500/20
                       active:scale-[0.98]"
            >
                <svg
                    class="h-4 w-4 text-slate-400
                           transition-colors group-hover:text-teal-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M12 21V9m0 0l-4 4m4-4l4 4
                           M5 3h14"
                    />
                </svg>

                <span>Import</span>
            </a>


            <!-- Divider -->
            <div class="hidden h-7 w-px bg-slate-200 sm:block"></div>


            <!-- New Task -->
            <a
                href="{% url 'organizations:task_create' %}"
                class="group inline-flex h-10 items-center justify-center
                       gap-2 rounded-xl
                       bg-teal-600 px-4
                       text-sm font-semibold text-white
                       shadow-sm transition-all duration-200
                       hover:bg-teal-700 hover:shadow-md
                       focus:outline-none
                       focus:ring-2 focus:ring-teal-500/30
                       active:scale-[0.98]"
            >
                <svg
                    class="h-4 w-4 transition-transform duration-200
                           group-hover:rotate-90"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 5v14M5 12h14"
                    />
                </svg>

                <span>Νέα εγγραφή</span>
            </a>

        </div>
    </div>
</div>


<div class="mt-6"></div>


<div
    x-data="{ openFilter: false }"
    @htmx:after-request.window="openFilter = false"
>

    <!-- Header -->
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">

    <!-- Left: Filters -->
    <button
        type="button"
        @click="openFilter = true"
        class="inline-flex items-center gap-2 rounded-xl
               border border-teal-600 bg-teal-600 px-5 py-2.5
               text-sm font-semibold text-white shadow-sm
               transition-all duration-200
               hover:border-teal-700 hover:bg-teal-700
               hover:shadow-md
               focus:outline-none focus:ring-2 focus:ring-teal-500/30"
    >
        <svg
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 4h18M6 10h12M10 16h4M11 21h2"
            />
        </svg>

        <span>Φίλτρα</span>
    </button>


    <!-- Right: Actions -->
    <div class="flex items-center gap-2">

        <!-- Download Template -->
        <a
            href="#"
            class="inline-flex items-center gap-2 rounded-xl
                   border border-slate-200 bg-white px-4 py-2.5
                   text-sm font-semibold text-slate-700
                   shadow-sm transition-all duration-200
                   hover:border-slate-300 hover:bg-slate-50
                   hover:text-slate-900 hover:shadow-md
                   focus:outline-none focus:ring-2
                   focus:ring-slate-300/50"
        >
            <svg
                class="h-4 w-4 text-slate-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 3v12m0 0l-4-4m4 4l4-4
                       M5 21h14"
                />
            </svg>

            <span>Λήψη Template</span>
        </a>


        <!-- View Mode -->
        <form method="post" class="m-0">
            {% csrf_token %}

            <button
                type="submit"
                name="view_mode"
                value="{% if request.session.task_view == 'cards' or not request.session.task_view %}table{% else %}cards{% endif %}"
                aria-label="Αλλαγή προβολής"
                title="Αλλαγή προβολής"
                class="inline-flex h-[42px] w-[42px]
                       items-center justify-center rounded-xl
                       border border-slate-200 bg-white
                       text-slate-600 shadow-sm
                       transition-all duration-200
                       hover:border-indigo-200
                       hover:bg-indigo-50
                       hover:text-indigo-600
                       hover:shadow-md
                       focus:outline-none
                       focus:ring-2 focus:ring-indigo-500/20"
            >

                {% if request.session.task_view == 'cards' or not request.session.task_view %}

                    <!-- Cards icon -->
                    <svg
                        class="h-5 w-5"
                        fill="currentColor"
                        viewBox="0 0 20 20"
                    >
                        <path
                            d="M3 3h6v6H3V3zm8 0h6v6h-6V3z
                               M3 11h6v6H3v-6zm8 0h6v6h-6v-6z"
                        />
                    </svg>

                {% else %}

                    <!-- Table icon -->
                    <svg
                        class="h-5 w-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 6h14M5 12h14M5 18h14"
                        />
                    </svg>

                {% endif %}

            </button>
        </form>

    </div>
</div>


    <!-- FILTER MODAL -->
    <div
        x-show="openFilter"
        x-transition
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
        style="display:none"
    >

        <div
            @click.outside="openFilter=false"
            class="max-h-[90vh] w-full max-w-6xl overflow-y-auto
                   rounded-xl bg-white p-6 shadow-xl"
        >

            <div class="mb-6 flex items-center justify-between">

                <h2 class="text-xl font-semibold">
                    Φίλτρα αναζήτησης
                </h2>

                <button
                    type="button"
                    @click="openFilter=false"
                    class="text-gray-500 hover:text-gray-900"
                >
                    ✕
                </button>

            </div>


            <form
                method="get"
                hx-get="{% url 'organizations:task_list' %}"
                hx-target="#task-wrapper"
                hx-swap="innerHTML"
                hx-push-url="true"
                id="task-filter-form"
            >
                <div class="mb-6">
                    <input
                        type="text"
                        name="q"
                        value="{{ request.GET.q|default:'' }}"
                        placeholder="Αναζήτηση εργασίας..."
                        class="w-full rounded-xl border border-gray-300
                            px-5 py-4 text-lg shadow-sm
                            focus:border-teal-500 focus:outline-none
                            focus:ring-2 focus:ring-teal-500/20"
                    >
                </div>

                <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">

                    <select
                        name="organization"
                        class="rounded-lg border px-4 py-3"
                    >
                        <option value="">
                            Όλοι οι οργανισμοί
                        </option>

                        {% for org in filter.form.organization.field.queryset %}
                            <option
                                value="{{ org.pk }}"
                                {% if request.GET.organization == org.pk|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >
                                {{ org }}
                            </option>
                        {% endfor %}
                    </select>

                    <select
                        name="org_app"
                        class="rounded-lg border px-4 py-3"
                    >
                        <option value="">
                            Όλες οι εφαρμογές OTS
                        </option>

                        {% for app in filter.form.org_app.field.queryset %}
                            <option
                                value="{{ app.pk }}"
                                {% if request.GET.org_app == app.pk|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >
                                {{ app }}
                            </option>
                        {% endfor %}
                    </select>

                    <select
                        name="job_type_acs"
                        class="rounded-lg border px-4 py-3"
                    >
                        <option value="">
                            Όλοι οι τύποι εργασίας
                        </option>

                        {% for job in filter.form.job_type_acs.field.queryset %}
                            <option
                                value="{{ job.pk }}"
                                {% if request.GET.job_type_acs == job.pk|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >
                                {{ job }}
                            </option>
                        {% endfor %}
                    </select>

                    <select
                        name="acs_employee"
                        class="rounded-lg border px-4 py-3"
                    >
                        <option value="">
                            Όλοι οι υπάλληλοι ACS
                        </option>

                        {% for emp in filter.form.acs_employee.field.queryset %}
                            <option
                                value="{{ emp.pk }}"
                                {% if request.GET.acs_employee == emp.pk|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >
                                {{ emp }}
                            </option>
                        {% endfor %}
                    </select>

                    <select
                        name="org_employee"
                        class="rounded-lg border px-4 py-3"
                    >
                        <option value="">
                            Όλοι οι υπάλληλοι οργανισμού
                        </option>

                        {% for emp in filter.form.org_employee.field.queryset %}
                            <option
                                value="{{ emp.pk }}"
                                {% if request.GET.org_employee == emp.pk|stringformat:"s" %}
                                    selected
                                {% endif %}
                            >
                                {{ emp }}
                            </option>
                        {% endfor %}
                    </select>

                    <input
                        type="text"
                        name="ticketid"
                        value="{{ request.GET.ticketid|default:'' }}"
                        placeholder="Αίτημα OTS"
                        class="rounded-lg border px-4 py-3"
                    >

                    <input
                        type="date"
                        name="importdate_after"
                        value="{{ request.GET.importdate_after|default:'' }}"
                        class="rounded-lg border px-4 py-3"
                    >

                    <input
                        type="date"
                        name="importdate_before"
                        value="{{ request.GET.importdate_before|default:'' }}"
                        class="rounded-lg border px-4 py-3"
                    >

                    <input
                        type="number"
                        name="year"
                        value="{{ request.GET.year|default:'' }}"
                        placeholder="Έτος"
                        min="2000"
                        max="2100"
                        class="rounded-lg border px-4 py-3"
                    >

                    <button
                        type="submit"
                        class="rounded-lg bg-teal-600 px-4 py-3
                            text-white hover:bg-teal-700 text-sm font-semibold"
                    >
                        Αναζήτηση
                    </button>
                </div>
            </form>


        </div>

    </div>

</div>


<!-- ========================================================= -->
<!-- RESULTS -->
<!-- ========================================================= -->

<div id="task-wrapper">

    {% include "organizations/task/_task_results.html" %}

</div>

<script> document.addEventListener("DOMContentLoaded", function () { const exportLink = document.getElementById("export-ergasies"); if (!exportLink) { return; } function updateExportUrl() { const currentUrl = new URL(window.location.href); const exportUrl = new URL(exportLink.dataset.exportUrl, window.location.origin); exportUrl.search = currentUrl.search; exportLink.href = exportUrl.toString(); } exportLink.dataset.exportUrl = exportLink.href; updateExportUrl(); document.body.addEventListener("htmx:pushedIntoHistory", function () { updateExportUrl(); }); window.addEventListener("popstate", function () { updateExportUrl(); }); }); </script>



<script>
    setTimeout(() => {
        const messages = document.getElementById("messages");

        if (messages) {
            messages.style.transition = "opacity 0.5s ease";
            messages.style.opacity = "0";

            setTimeout(() => {
                messages.remove();
            }, 500);
        }
    }, 3000);
</script>
{% endblock %}
