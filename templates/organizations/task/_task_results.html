{% if request.session.task_view != 'table' %}

    <div
        id="task-items"
        class="grid w-full grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4"
    >
        {% include "organizations/task/_task_items.html" %}
    </div>

    <div
        id="load-more-container"
        class="mt-8 flex justify-center"
    >
        {% include "organizations/task/_load_more.html" %}
    </div>

{% else %}

    <div id="task-table">
        {% include "organizations/task/_task_table.html" %}
    </div>

{% endif %}
