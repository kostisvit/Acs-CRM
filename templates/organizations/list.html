{% extends '_base.html' %}

{% block title %}
  Organizations
{% endblock %}

{% block content %}
  <!-- Toolbar -->
  <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <h2 class="text-lg font-semibold text-gray-900">Οργανισμοί</h2>
        <p class="text-sm text-gray-500">Διαχείριση οργανισμών</p>
      </div>

      <div class="flex flex-wrap items-center justify-end gap-3">
        <!-- Search -->
        <input type="text" placeholder="Search..." class="w-64 rounded-lg border border-gray-300 px-4 py-2 focus:border-teal-400 focus:ring-2 focus:ring-teal-300" />

        <!-- Import -->
        <a href="{% url 'organizations:import_customers' %}" class="rounded-lg border border-teal-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-teal-50 inline-block">Import</a>

        <!-- Export -->
        <button class="rounded-lg border border-teal-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-teal-50">Export</button>

        <!-- New -->
        <a href="" class="rounded-lg bg-teal-300 px-5 py-2 text-sm font-semibold text-gray-900 hover:bg-teal-400">+ Νέος οργανισμός</a>
      </div>
    </div>
  </div>

  <!-- Space between toolbar and table -->
  <div class="mt-6"></div>

  <!-- Table Card -->
 
    <div id="organization-list"
     class="grid grid-cols-1 gap-5 md:grid-cols-3">

    {% include "organizations/_cards.html" %}


  </div>
  {% if organizations.has_next %}

<div class="mt-8 flex justify-center">

<button
    hx-get="?page={{ organizations.next_page_number }}"
    hx-target="#organization-list"
    hx-swap="beforeend"
    class="rounded-xl bg-teal-600 px-6 py-3 text-white hover:bg-teal-700">

    Load more

</button>

</div>

{% endif %}
{% endblock %}
