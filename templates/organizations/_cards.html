{% for org in organizations %}
  <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm transition hover:shadow-md">
    <div class="flex items-center gap-4">
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-teal-300 font-semibold text-gray-800">{{ org.initials }}</div>

      <div>
        <h3 class="font-semibold text-gray-900">{{ org.org_name }}</h3>

        <p class="text-sm text-gray-500">{{ org.org_city }}</p>
      </div>
    </div>

    <div class="mt-5 space-y-2 text-sm text-gray-600">
      <div class="flex justify-between">
        <span>Τηλέφωνο</span>
        <span class="font-medium text-gray-900">{{ org.org_phone }}</span>
      </div>

      <div class="flex justify-between">
        <span>Status</span>

        {% if org.is_visible %}
          <span class="rounded-full bg-green-100 px-3 py-1 text-xs text-green-700">Ενεργός</span>
        {% else %}
          <span class="rounded-full bg-red-100 px-3 py-1 text-xs text-red-700">Μη ενεργός</span>
        {% endif %}
      </div>

      <div class="flex justify-between">
        <span>Created</span>
        <span>{{ org.created|date:'d/m/Y' }}</span>
      </div>
    </div>

    <div class="mt-5 flex justify-end">
      <button class="rounded-lg bg-blue-50 px-4 py-2 text-sm font-medium text-blue-600 hover:bg-blue-100">Edit</button>
    </div>
  </div>
{% empty %}
  <div class="col-span-full rounded-xl bg-white p-8 text-center text-gray-500">Δεν υπάρχουν οργανισμοί</div>
{% endfor %}
