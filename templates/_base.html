{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Compiled Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Flatpickr -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    >
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <title>Acs Services | {% block title %}{% endblock %}</title>
</head>

<body
    x-data="{
        open: false,
        organizations: false,
        acs: false,
        config: false
    }"
    class="bg-[#F8F8FF] text-gray-800"
>

    <!-- Navbar -->
    <header
        class="
            fixed top-0 left-0 right-0 z-40
            flex h-16 items-center justify-between
            border-b border-gray-200
            bg-white px-5
        "
    >

        <!-- Mobile Menu Button -->
        <button
            type="button"
            @click="open = !open"
            :aria-expanded="open"
            aria-label="Toggle navigation"
            class="text-2xl text-[#0B1F3A] md:hidden"
        >
            ☰
        </button>

        <!-- Logo and Brand -->
        <div class="flex items-center gap-3">
            <div
                class="
                    flex h-9 w-9 items-center justify-center
                    rounded-lg bg-teal-300
                    font-bold text-white
                "
            >
                A
            </div>

            <h1 class="text-xl font-bold text-[#0B1F3A]">
                Acs Services
            </h1>
        </div>

        <!-- User Menu -->
        <div class="relative group">
            <button
                type="button"
                aria-label="Open user menu"
                class="flex items-center gap-4 cursor-pointer"
            >
                <div
                    class="
                        flex h-10 w-10 items-center justify-center
                        rounded-full bg-teal-300 font-medium
                    "
                >
                    {{ user.first_name|slice:":1"|upper }}{{ user.last_name|slice:":1"|upper }}
                </div>
            </button>

            <!-- User Dropdown -->
            <div
                class="
                    absolute right-0 top-full z-50
                    hidden pt-3 group-hover:block
                    group-focus-within:block
                "
            >
                <div
                    class="
                        w-48 overflow-hidden rounded-lg
                        border border-gray-100
                        bg-white shadow-lg
                    "
                >
                    <a
                        href="{% url 'admin:index' %}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="
                            block px-4 py-3 text-sm text-gray-700
                            hover:bg-teal-300
                        "
                    >
                        Ρυθμίσεις
                    </a>

                    <a
                        href="{% url 'accounts:profile' %}"
                        class="
                            block px-4 py-3 text-sm text-gray-700
                            hover:bg-teal-300
                        "
                    >
                        Επεξεργασία προφίλ χρήστη
                    </a>

                    <div class="border-t"></div>

                    <form
                        action="{% url 'accounts:logout' %}"
                        method="POST"
                    >
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="
                                w-full px-4 py-3 text-left
                                text-sm font-semibold text-red-600
                                hover:bg-red-50
                            "
                        >
                            Αποσύνδεση
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </header>

    <!-- Sidebar -->
    <aside
        id="sidebar"
        class="
            fixed bottom-0 left-0 top-16 z-30
            w-64 border-r border-gray-200
            bg-white font-['Inter',sans-serif]
            text-gray-900 shadow-lg
            transition-transform duration-300
        "
        :class="open
            ? 'translate-x-0'
            : '-translate-x-full md:translate-x-0'"
    >
        <div class="py-5">
            <ul>

                <!-- Dashboard -->
                <li class="border-b border-gray-200">
                    <a
                        href="/"
                        class="
                            flex w-full items-center gap-3
                            px-4 py-4 transition
                            hover:bg-teal-300
                        "
                    >
                        <span class="text-gray-500">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="h-7 w-7"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                                />
                            </svg>
                        </span>

                        <span class="font-medium">Dashboard</span>
                    </a>
                </li>

                <!-- Organizations / Archive -->
                <li class="border-b border-gray-200">
                    <button
                        type="button"
                        @click="organizations = !organizations"
                        :aria-expanded="organizations"
                        class="
                            flex w-full items-center justify-between
                            px-4 py-4 transition
                            hover:bg-teal-300
                        "
                    >
                        <div class="flex items-center gap-3">
                            <span class="text-gray-500">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke-width="1.5"
                                    stroke="currentColor"
                                    class="h-7 w-7"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
                                    />
                                </svg>
                            </span>

                            <span class="font-medium">Αρχείο</span>
                        </div>

                        <span
                            class="transition-transform duration-300"
                            :class="organizations ? 'rotate-180' : ''"
                        >
                            ⌄
                        </span>
                    </button>

                    <div
                        x-show="organizations"
                        x-collapse
                        class="
                            ml-6 border-l border-gray-200
                            py-2 pl-4 space-y-1
                        "
                    >
                        <a
                            href="{% url 'organizations:organization_list' %}"
                            class="
                                block rounded-lg px-3 py-2
                                text-gray-600 transition
                                hover:bg-teal-300 hover:text-black
                            "
                        >
                            Οργανισμοί
                        </a>

                        <a
                            href="{% url 'organizations:employee_list' %}"
                            class="
                                block rounded-lg px-3 py-2
                                text-gray-600 transition
                                hover:bg-teal-300 hover:text-black
                            "
                        >
                            Επαφές
                        </a>

                        <a
                            href="{% url 'organizations:task_list' %}"
                            class="
                                block rounded-lg px-3 py-2
                                text-gray-600 transition
                                hover:bg-teal-300 hover:text-black
                            "
                        >
                            Εργασίες

                            <span
                                class="
                                    ml-2 inline-flex items-center
                                    justify-center rounded-full
                                    bg-red-100 px-2 py-1
                                    text-xs font-bold leading-none
                                    text-red-700
                                "
                            >
                                {{ total_tasks }}
                            </span>
                        </a>

                        <a
                            href="{% url 'cash:customer_list' %}"
                            class="
                                block rounded-lg px-3 py-2
                                text-gray-600 transition
                                hover:bg-teal-300 hover:text-black
                            "
                        >
                            Ταμειακές
                        </a>
                    </div>
                </li>

                <!-- ACS -->
                <li class="border-b border-gray-200">
                    <button
                        type="button"
                        @click="acs = !acs"
                        :aria-expanded="acs"
                        class="
                            flex w-full items-center justify-between
                            px-4 py-4 transition
                            hover:bg-teal-300
                        "
                    >
                        <div class="flex items-center gap-3">
                            <span class="text-gray-500">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke-width="1.5"
                                    stroke="currentColor"
                                    class="h-7 w-7"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25"
                                    />
                                </svg>
                            </span>

                            <span class="font-medium">ACS</span>
                        </div>

                        <span
                            class="transition-transform duration-300"
                            :class="acs ? 'rotate-180' : ''"
                        >
                            ⌄
                        </span>
                    </button>

                    <div
                        x-show="acs"
                        x-collapse
                        class="
                            ml-6 border-l border-gray-200
                            py-2 pl-4 space-y-1
                        "
                    >
                        <a
                            href="{% url 'accounts:my_leave_dashboard' %}"
                            class="
                                block rounded-lg px-3 py-2
                                text-gray-600 transition
                                hover:bg-teal-300 hover:text-black
                            "
                        >
                            Άδειες
                        </a>
                    </div>
                </li>

                <!-- Settings -->
                <li class="border-b border-gray-200">
                    <button
                        type="button"
                        @click="config = !config"
                        :aria-expanded="config"
                        class="
                            flex w-full items-center justify-between
                            px-4 py-4 transition
                            hover:bg-teal-300
                        "
                    >
                        <div class="flex items-center gap-3">
                            <span class="text-gray-500">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke-width="1.5"
                                    stroke="currentColor"
                                    class="h-7 w-7"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.894.149c-.424.07-.764.383-.929.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.398.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06-.12-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.272-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z"
                                    />
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                                    />
                                </svg>
                            </span>

                            <span class="font-medium">Ρυθμίσεις</span>
                        </div>

                        <span
                            class="transition-transform duration-300"
                            :class="config ? 'rotate-180' : ''"
                        >
                            ⌄
                        </span>
                    </button>

                    <div
                        x-show="config"
                        x-collapse
                        class="
                            ml-6 border-l border-gray-200
                            py-2 pl-4 space-y-1
                        "
                    >
                        <a
                            href="{% url 'parameters:parameters' %}"
                            class="
                                block rounded-lg px-3 py-2
                                text-gray-600 transition
                                hover:bg-teal-300 hover:text-black
                            "
                        >
                            Παραμετρικά
                        </a>

                        <a
                            href="{% url 'accounts:users' %}"
                            class="
                                block rounded-lg px-3 py-2
                                text-gray-600 transition
                                hover:bg-teal-300 hover:text-black
                            "
                        >
                            Χρήστες
                        </a>
                    </div>
                </li>

                <!-- Reports -->
                <li class="border-b border-gray-200">
                    <a
                        href="#"
                        class="
                            flex items-center gap-3
                            px-4 py-4 transition
                            hover:bg-teal-300
                        "
                    >
                        <span class="text-gray-500">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="h-7 w-7"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"
                                />
                            </svg>
                        </span>

                        <span class="font-medium">Στατιστικά</span>
                    </a>
                </li>

            </ul>
        </div>
    </aside>

    <!-- Mobile Overlay -->
    <div
        x-show="open"
        x-cloak
        @click="open = false"
        class="
            fixed inset-0 z-20
            bg-black/40 md:hidden
        "
    ></div>

    <!-- Page Content -->
    <main class="p-6 pt-20 md:ml-64">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
