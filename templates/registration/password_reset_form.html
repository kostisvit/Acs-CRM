{% load static %}

<link rel="stylesheet" href="{% static 'css/dist/styles.css' %}" />

{% block content %}
  <div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
      <h1 class="text-3xl font-bold text-center mb-6">Forgot Password</h1>

      <p class="text-gray-600 mb-6">Enter your email and we'll send you a password reset link.</p>

      <form method="post">
        {% csrf_token %}

        <div class="mb-5">
          <label class="block mb-2 font-medium">Email</label>

          <input type="email" name="email" required class="w-full rounded-lg border px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>

        {% if form.errors %}
          <div class="mb-4 text-red-600 text-sm">{{ form.errors }}</div>
        {% endif %}

        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white rounded-lg py-3 transition">Send Reset Link</button>
      </form>
    </div>
  </div>
{% endblock %}
